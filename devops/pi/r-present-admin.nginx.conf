# R. Present admin, next to Pi-hole, the Yesler dashboard and the default :80 site.
# Install: /etc/nginx/sites-available/r-present-admin (symlinked into sites-enabled)
#
# Each site answers two ways:
#   https://admin.r-present.com    and http://192.168.0.15:8080 (fallback)
#   https://preview.r-present.com  and http://192.168.0.15:8081 (fallback)
# admin and preview are DNS-only Cloudflare A records pointing at 192.168.0.15,
# so they only work on the home network. One Let's Encrypt cert covers both,
# issued on the Pi with certbot's dns-cloudflare plugin (see devops/pi/README.md).
# nginx owns 443 and picks the site by hostname.

server {
    listen 8080;
    listen [::]:8080;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.r-present.com;

    ssl_certificate     /etc/letsencrypt/live/admin.r-present.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.r-present.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Built admin SPA
    root /srv/r-present/repo/apps/r-present-admin/dist;
    index index.html;

    location /api/ {
        # Phone photos run several MB; nginx's default cap is 1MB. Matches the
        # backend's own limit (uploads.maxBytes in config.ts).
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preview builds take ~30-40s on the Pi 3.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so a redeploy shows up right away.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

# Draft preview of the public site, built by the admin's "Build preview" button.
# Served at the root of its own port because the site uses root-relative URLs.
server {
    listen 8081;
    listen [::]:8081;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview.r-present.com;

    ssl_certificate     /etc/letsencrypt/live/admin.r-present.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.r-present.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/r-present/repo/.preview;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Rebuilds replace these files; make sure the browser asks for fresh ones.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

# Typing admin.r-present.com without https:// lands on port 80; send it to HTTPS
# instead of the Pi's default page.
server {
    listen 80;
    listen [::]:80;
    server_name admin.r-present.com preview.r-present.com;
    return 301 https://$host$request_uri;
}
