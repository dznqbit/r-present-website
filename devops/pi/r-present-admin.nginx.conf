# R. Present admin, on :8080 next to Pi-hole and the default :80 site.
# Install: /etc/nginx/sites-available/r-present-admin (symlinked into sites-enabled)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Built admin SPA
    root /srv/r-present/repo/apps/r-present-admin/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preview builds take ~30-40s on the Pi 3.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html so a redeploy shows up right away.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
